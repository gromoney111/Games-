<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Shooter - GameZone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0a0a1a; color: #e0e0ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
        .back-link { align-self: flex-start; color: #6c63ff; text-decoration: none; font-weight: 600; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .back-link:hover { color: #ff6584; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #6c63ff, #00d4aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .score-board { display: flex; gap: 2rem; margin: 1rem 0; font-size: 1.1rem; }
        .score-board span { color: #8888aa; }
        .score-board strong { color: #00d4aa; }
        canvas { border: 2px solid #6c63ff; border-radius: 8px; background: #05050f; display: block; max-width: 100%; touch-action: none; cursor: crosshair; }
        .btn { padding: 0.8rem 2rem; background: linear-gradient(135deg, #6c63ff, #ff6584); color: white; border: none; border-radius: 25px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .game-over { display: none; text-align: center; margin-top: 1rem; }
        .game-over h2 { color: #ff6584; font-size: 1.5rem; }
        .controls { margin-top: 0.5rem; color: #8888aa; text-align: center; font-size: 0.9rem; }
        @media (max-width: 500px) { canvas { width: 100%; height: auto; } }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Back to Games</a>
    <h1>🫧 Bubble Shooter</h1>
    <div class="score-board">
        <div><span>Score: </span><strong id="score">0</strong></div>
        <div><span>Level: </span><strong id="level">1</strong></div>
    </div>
    <canvas id="game" width="400" height="500"></canvas>
    <div class="controls"><p>Click/tap to aim and shoot bubbles. Match 3+ same colors!</p></div>
    <div class="game-over" id="gameover">
        <h2>Game Over!</h2>
        <p>Final Score: <strong id="final-score">0</strong></p>
        <button class="btn" onclick="initGame()">Play Again</button>
    </div>
    <button class="btn" id="start-btn" onclick="initGame()" style="display:none">Play Again</button>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const COLORS = ['#ff6584', '#6c63ff', '#00d4aa', '#ffb347', '#ff47b3', '#47b3ff'];
        const RADIUS = 18;
        const ROWS = 10;
        const COLS = Math.floor(canvas.width / (RADIUS * 2));
        let bubbles = [], shooterBubble, nextBubble, score = 0, level = 1, angle = Math.PI / 2;
        let shooting = false, shotBubble = null, animFrame;
        let gameActive = false;

        function createGrid() {
            bubbles = [];
            let fillRows = 3 + Math.min(level, 5);
            for (let r = 0; r < fillRows; r++) {
                for (let c = 0; c < COLS; c++) {
                    let offset = (r % 2 === 1) ? RADIUS : 0;
                    let x = c * RADIUS * 2 + RADIUS + offset;
                    let y = r * RADIUS * 1.8 + RADIUS;
                    if (x + RADIUS <= canvas.width) {
                        bubbles.push({ x, y, color: COLORS[Math.floor(Math.random() * Math.min(3 + level, COLORS.length))], r, c, alive: true });
                    }
                }
            }
        }

        function initGame() {
            score = 0; level = 1;
            document.getElementById('score').textContent = '0';
            document.getElementById('level').textContent = '1';
            document.getElementById('gameover').style.display = 'none';
            createGrid();
            shooterBubble = { color: COLORS[Math.floor(Math.random() * 3)] };
            nextBubble = { color: COLORS[Math.floor(Math.random() * 3)] };
            shooting = false; shotBubble = null;
            gameActive = true;
            if (animFrame) cancelAnimationFrame(animFrame);
            gameLoop();
        }

        function drawBubble(x, y, color, r) {
            ctx.beginPath();
            ctx.arc(x, y, r || RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Shine effect
            ctx.beginPath();
            ctx.arc(x - r/3 || x - 5, y - r/3 || y - 5, (r || RADIUS) / 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = '#05050f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Grid bubbles
            bubbles.forEach(b => { if (b.alive) drawBubble(b.x, b.y, b.color); });
            // Shooter
            let sx = canvas.width / 2, sy = canvas.height - 40;
            drawBubble(sx, sy, shooterBubble.color);
            // Next bubble indicator
            ctx.fillStyle = '#8888aa';
            ctx.font = '12px Poppins';
            ctx.fillText('Next:', 10, canvas.height - 50);
            drawBubble(30, canvas.height - 30, nextBubble.color, 12);
            // Aim line
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + Math.cos(angle) * 60, sy - Math.sin(angle) * 60);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            // Shot bubble
            if (shotBubble) drawBubble(shotBubble.x, shotBubble.y, shotBubble.color);
        }

        function shoot() {
            if (shooting) return;
            shooting = true;
            let sx = canvas.width / 2, sy = canvas.height - 40;
            shotBubble = { x: sx, y: sy, color: shooterBubble.color, dx: Math.cos(angle) * 8, dy: -Math.sin(angle) * 8 };
        }

        function getNeighbors(bubble) {
            return bubbles.filter(b => b.alive && b !== bubble && Math.hypot(b.x - bubble.x, b.y - bubble.y) < RADIUS * 2.2);
        }

        function findCluster(start) {
            let cluster = [start];
            let visited = new Set([bubbles.indexOf(start)]);
            let queue = [start];
            while (queue.length) {
                let curr = queue.shift();
                let neighbors = getNeighbors(curr);
                for (let n of neighbors) {
                    let idx = bubbles.indexOf(n);
                    if (!visited.has(idx) && n.color === start.color) {
                        visited.add(idx);
                        cluster.push(n);
                        queue.push(n);
                    }
                }
            }
            return cluster;
        }

        function findFloating() {
            // BFS from top row
            let connected = new Set();
            let queue = bubbles.filter(b => b.alive && b.y <= RADIUS * 2);
            queue.forEach(b => connected.add(bubbles.indexOf(b)));
            while (queue.length) {
                let curr = queue.shift();
                let neighbors = getNeighbors(curr);
                for (let n of neighbors) {
                    let idx = bubbles.indexOf(n);
                    if (!connected.has(idx)) {
                        connected.add(idx);
                        queue.push(n);
                    }
                }
            }
            return bubbles.filter((b, i) => b.alive && !connected.has(i));
        }

        function snapBubble(shot) {
            // Find nearest grid position
            let row = Math.round((shot.y - RADIUS) / (RADIUS * 1.8));
            let offset = (row % 2 === 1) ? RADIUS : 0;
            let col = Math.round((shot.x - RADIUS - offset) / (RADIUS * 2));
            let x = col * RADIUS * 2 + RADIUS + offset;
            let y = row * RADIUS * 1.8 + RADIUS;
            let newBubble = { x, y, color: shot.color, r: row, c: col, alive: true };
            bubbles.push(newBubble);
            // Check cluster
            let cluster = findCluster(newBubble);
            if (cluster.length >= 3) {
                cluster.forEach(b => b.alive = false);
                score += cluster.length * 10;
                // Remove floating
                let floating = findFloating();
                floating.forEach(b => b.alive = false);
                score += floating.length * 5;
                document.getElementById('score').textContent = score;
                // Check level
                if (bubbles.filter(b => b.alive).length === 0) {
                    level++;
                    document.getElementById('level').textContent = level;
                    createGrid();
                }
            }
            // Check game over
            if (y > canvas.height - 100) {
                gameActive = false;
                document.getElementById('final-score').textContent = score;
                document.getElementById('gameover').style.display = 'block';
                return;
            }
            shooterBubble = nextBubble;
            nextBubble = { color: COLORS[Math.floor(Math.random() * Math.min(3 + level, COLORS.length))] };
            shooting = false;
            shotBubble = null;
        }

        function update() {
            if (shotBubble) {
                shotBubble.x += shotBubble.dx;
                shotBubble.y += shotBubble.dy;
                // Wall bounce
                if (shotBubble.x <= RADIUS || shotBubble.x >= canvas.width - RADIUS) shotBubble.dx *= -1;
                // Top
                if (shotBubble.y <= RADIUS) { snapBubble(shotBubble); return; }
                // Collision with grid bubbles
                for (let b of bubbles) {
                    if (b.alive && Math.hypot(b.x - shotBubble.x, b.y - shotBubble.y) < RADIUS * 2) {
                        snapBubble(shotBubble); return;
                    }
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            animFrame = requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            let my = (e.clientY - rect.top) * (canvas.height / rect.height);
            let sx = canvas.width / 2, sy = canvas.height - 40;
            angle = Math.atan2(sy - my, mx - sx);
            if (angle < 0.1) angle = 0.1;
            if (angle > Math.PI - 0.1) angle = Math.PI - 0.1;
        });

        canvas.addEventListener('click', () => { if (gameActive) shoot(); });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let mx = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            let my = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            let sx = canvas.width / 2, sy = canvas.height - 40;
            angle = Math.atan2(sy - my, mx - sx);
            if (angle < 0.1) angle = 0.1;
            if (angle > Math.PI - 0.1) angle = Math.PI - 0.1;
            if (gameActive) shoot();
        });

        initGame();
    </script>
</body>
</html>
