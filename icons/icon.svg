<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e0ff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  <!-- Controller body -->
  <path d="M 130 220 C 130 180 160 160 200 160 L 312 160 C 352 160 382 180 382 220 L 382 280 C 382 310 370 340 350 360 L 320 390 C 300 410 270 400 260 380 L 252 360 L 252 360 L 260 380 C 250 400 220 410 200 390 L 170 360 C 150 340 130 310 130 280 Z" fill="url(#padGrad)" opacity="0.95"/>
  <!-- D-pad (left side) -->
  <rect x="165" y="235" width="50" height="16" rx="4" fill="#667eea"/>
  <rect x="182" y="218" width="16" height="50" rx="4" fill="#667eea"/>
  <!-- Action buttons (right side) -->
  <circle cx="330" cy="225" r="12" fill="#ff6b6b"/>
  <circle cx="356" cy="243" r="12" fill="#51cf66"/>
  <circle cx="330" cy="261" r="12" fill="#339af0"/>
  <circle cx="304" cy="243" r="12" fill="#ffd43b"/>
  <!-- Center buttons -->
  <rect x="235" y="238" width="18" height="10" rx="5" fill="#aaa"/>
  <rect x="260" y="238" width="18" height="10" rx="5" fill="#aaa"/>
  <!-- Joystick hints -->
  <circle cx="200" cy="300" r="18" fill="none" stroke="#667eea" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="300" r="8" fill="#667eea" opacity="0.8"/>
  <circle cx="320" cy="300" r="18" fill="none" stroke="#764ba2" stroke-width="3" opacity="0.6"/>
  <circle cx="320" cy="300" r="8" fill="#764ba2" opacity="0.8"/>
  <!-- Shine/glow effect -->
  <ellipse cx="220" cy="180" rx="60" ry="15" fill="white" opacity="0.15"/>
</svg>
