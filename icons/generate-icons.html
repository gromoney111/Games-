<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PWA Icons - Game Zone</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0ff;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #667eea; }
        .icon-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 2rem 0;
        }
        .icon-item {
            text-align: center;
            background: #1a1a3e;
            padding: 1rem;
            border-radius: 10px;
        }
        .icon-item canvas {
            display: block;
            margin: 0 auto 0.5rem;
        }
        .icon-item span {
            font-size: 0.8rem;
            color: #8888aa;
        }
        button {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.5rem;
        }
        button:hover { opacity: 0.9; }
        .instructions {
            background: #1a1a3e;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🎮 Game Zone - Icon Generator</h1>
    <div class="instructions">
        <p><strong>Instructions:</strong> Click "Generate All Icons" to create PNG icon files. Then right-click each icon and "Save Image As" with the filename shown below it.</p>
        <p>Required sizes: 72x72, 96x96, 128x128, 144x144, 152x152, 192x192, 384x384, 512x512</p>
    </div>
    
    <button onclick="generateAll()">Generate All Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>
    
    <div class="icon-preview" id="preview"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function drawIcon(canvas, size) {
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background with rounded corners
            const radius = size / 5;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw gamepad emoji
            ctx.font = `${size * 0.5}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎮', size / 2, size / 2);
            
            return canvas;
        }
        
        function generateAll() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            
            sizes.forEach(size => {
                const item = document.createElement('div');
                item.className = 'icon-item';
                
                const canvas = document.createElement('canvas');
                drawIcon(canvas, size);
                
                const label = document.createElement('span');
                label.textContent = `icon-${size}x${size}.png`;
                
                item.appendChild(canvas);
                item.appendChild(label);
                preview.appendChild(item);
            });
        }
        
        function downloadAll() {
            sizes.forEach((size, i) => {
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    drawIcon(canvas, size);
                    
                    const link = document.createElement('a');
                    link.download = `icon-${size}x${size}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }, i * 500);
            });
        }
        
        // Auto-generate on load
        generateAll();
    </script>
</body>
</html>
